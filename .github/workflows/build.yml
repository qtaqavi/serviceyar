name: Android CI - Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PROJECT_DIR: ./        # تغییر دهید اگر پروژه در زیرپوشه است (مثال: ./app)

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Cache Gradle and wrapper
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties','**/gradle/*.versions.toml') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Decode keystore from secrets (optional)
      if: ${{ secrets.KEYSTORE_BASE64 != '' }}
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
        ls -l release.jks

    - name: Set up signing properties (optional)
      if: ${{ secrets.KEYSTORE_BASE64 != '' }}
      run: |
        echo "RELEASE_STORE_FILE=release.jks" >> gradle.properties
        echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> gradle.properties
        echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> gradle.properties
        echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> gradle.properties

    - name: Verify project files (debug)
      run: |
        echo "Working directory: $(pwd)"
        echo "List files:"
        ls -la

    - name: Build release APK
      run: ./gradlew clean assembleRelease --no-daemon --stacktrace

    - name: Build debug APK (optional)
      if: always()
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload release APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: ${{ env.PROJECT_DIR }}/app/build/outputs/**/*.apk

    - name: Upload debug APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: ${{ env.PROJECT_DIR }}/app/build/outputs/**/*.apk
